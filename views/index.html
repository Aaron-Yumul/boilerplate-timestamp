<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Timestamp Microservice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 60px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #222;
    }
    code {
      background: #f2f2f2;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Timestamp Microservice</h1>
  <p>Send a request to:</p>
  <ul>
    <li><code>/api/2015-12-25</code></li>
    <li><code>/api/1451001600000</code></li>
    <li><code>/api/</code> (empty date returns current time)</li>
  </ul>
  <p>Example response:</p>
  <pre><code>{ "unix": 1451001600000, "utc": "Fri, 25 Dec 2015 00:00:00 GMT" }</code></pre>
</body>
</html>
